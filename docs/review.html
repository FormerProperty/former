const pick={};
try{Object.assign(pick,JSON.parse(localStorage.getItem('former-review')||'{}'))}catch(e){}
const g=document.getElementById('g');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){
  g.innerHTML=ROWS.map(r=>`<div class="card ${pick[r.id]||''}" id="c${r.id}">
   <img src="${r.img}" onerror="this.onerror=null;this.src='${r.small}'" alt="${esc(r.title)}" loading="lazy">
   <div class="in"><span class="was">former. ${esc(r.was)}</span><span>${esc(r.place)}, ${esc(r.county)}</span>
   <span class="small">Photo: “${esc(r.title)}” by ${esc(r.author)}${r.year?' ('+r.year+')':''}</span>
   <span class="small"><a href="${r.url}" target="_blank" rel="noopener">Listing</a> · <a href="https://www.geograph.org.uk/photo/${r.pid}" target="_blank" rel="noopener">Photo page</a></span></div>
   <div class="btns"><button class="k" type="button" data-id="${r.id}" data-v="keep">Keep</button><button class="r" type="button" data-id="${r.id}" data-v="reject">Reject</button></div></div>`).join('');
  const done=Object.keys(pick).length;
  document.getElementById('n').textContent=`${done} of ${ROWS.length} decided`;
  document.getElementById('out').value='photo review: keep '+ROWS.filter(r=>pick[r.id]==='keep').map(r=>r.id).join(',')+' ; reject '+ROWS.filter(r=>pick[r.id]==='reject').map(r=>r.id).join(',');
}
g.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;pick[b.dataset.id]=b.dataset.v;try{localStorage.setItem('former-review',JSON.stringify(pick))}catch(e){}draw();});
document.getElementById('copy').addEventListener('click',async()=>{const t=document.getElementById('out');try{await navigator.clipboard.writeText(t.value);document.getElementById('copy').textContent='Copied'}catch(e){t.select()}});
draw();
</script></body></html>
