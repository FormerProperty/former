name: Check larger Geograph images (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - > img-check.txt <<'PY'
          import json, os, sys
          sys.path.insert(0, "build")
          import bluesky
          ls = [l for l in json.load(open("docs/data/listings.json"))["listings"] if l.get("photo")][:4]
          for l in ls:
              p = bluesky.sharper_image(l, "THUMB")
              print(l["id"], p, os.path.getsize(p) if os.path.exists(p) else "-")
          PY
          git config user.name "formerly. bot"; git config user.email "noreply@github.com"
          git checkout -b probe-out; git add -f img-check.txt; git commit -qm check; git push -f origin probe-out
