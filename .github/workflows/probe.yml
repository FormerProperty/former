name: Probe (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - > probe.txt <<'PY'
          import json, sys
          sys.path.insert(0, "build")
          import find_photos as f
          rows = f.search(51.2905, 0.5022, ["castle"])
          for r in rows[:12]:
              print(json.dumps({k: r.get(k) for k in ("id","title","realname","takenday","hash","d")}))
          PY
          git config user.name "formerly. bot"; git config user.email "noreply@github.com"
          git checkout -b probe-out; git add -f probe.txt; git commit -qm probe; git push -f origin probe-out
