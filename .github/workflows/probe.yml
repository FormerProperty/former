name: Probe Geograph API
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          LAT=$(python3 -c "import math;print(math.radians(52.6987))"); LNG=$(python3 -c "import math;print(math.radians(1.6215))")
          {
          echo "== facetql match+geodist"; curl -s -m 30 "https://api.geograph.org.uk/api-facetql.php?select=id,title,realname,takenday,hash,wgs84_lat,wgs84_long,GEODIST(wgs84_lat,wgs84_long,$LAT,$LNG)+as+d&match=mill&order=d+asc&limit=3" | head -c 1500; echo
          echo "== facetql where d"; curl -s -m 30 "https://api.geograph.org.uk/api-facetql.php?select=id,title,realname,hash,GEODIST(wgs84_lat,wgs84_long,$LAT,$LNG)+as+d&where=d<300&order=d+asc&limit=3" | head -c 1500; echo
          echo "== syndicator"; curl -s -m 30 "https://api.geograph.org.uk/syndicator.php?q=mill&lat=52.6987&long=1.6215&distance=0.3&format=JSON" | head -c 800; echo
          } > probe-out.txt 2>&1
          git config user.name "former. bot"; git config user.email "noreply@github.com"
          git checkout -b probe-out; git add -f probe-out.txt; git commit -qm probe; git push -f origin probe-out
