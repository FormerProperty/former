name: Weekly email
on:
  schedule:
    # Fridays at about 2pm UK time. GitHub often starts scheduled jobs late, so there are three tries
    # (13:07, 14:07, 15:07 UTC); the script acts on the first from 1:45pm UK time and skips the rest.
    # The email is created in Buttondown scheduled to send at 10:30am on Saturday; Tanya can edit or
    # cancel it there until then.
    - cron: "7 13,14,15 * * 5"
  workflow_dispatch:
    inputs:
      test:
        description: "Make a test draft (not scheduled)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: newsletter
  cancel-in-progress: false
jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create this week's email in Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          set -o pipefail
          python build/newsletter.py ${{ github.event_name == 'schedule' && '--scheduled' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '--test' || '' }} 2>&1 | tail -5 | tee social/newsletter-run.log
      - name: Record that it was created
        if: always()
        run: |
          git config user.name "formerly. bot"
          git config user.email "noreply@github.com"
          for f in social/newsletter-last.json social/newsletter-run.log; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "Record weekly email" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done)
