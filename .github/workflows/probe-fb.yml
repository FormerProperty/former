name: Probe Facebook tokens
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Facebook the 6pm buildings that missed it (prints no secrets)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GRANDLY_FB_PAGE_ID: ${{ secrets.GRANDLY_FB_PAGE_ID }}
          GRANDLY_FB_PAGE_TOKEN: ${{ secrets.GRANDLY_FB_PAGE_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/probe.txt 2>&1 || true
          import sys, json, os
          sys.argv = ["bluesky.py"]; sys.path.insert(0, "build")
          import bluesky, facebook
          for name, cfg in bluesky.SITES.items():
              log = json.load(open(os.path.join(cfg["records"], "bluesky-log.json")))
              done = {p["id"] for p in json.load(open(os.path.join(cfg["records"], "facebook-posted.json")))} if os.path.exists(os.path.join(cfg["records"], "facebook-posted.json")) else set()
              last = log[-1]["id"]
              if last in done: print(name, "already on Facebook"); continue
              data = json.load(open(os.path.join(cfg["dir"], "data", "listings.json")))
              x = next(l for l in data["listings"] if l["id"] == last)
              img = os.path.join(cfg["dir"], x["photo"]["src"]) if x.get("photo") else os.path.join(cfg["dir"], "email", "labels", __import__("re").sub(r"[^a-z0-9]+", "-", (x.get("os") or "bldg").lower()) + ".png")
              try: print(name, "->", facebook.post(x, len(data["listings"]), img, site=cfg))
              except Exception as e: print(name, "FAILED", e)
          PY
          git config user.name "formerly. bot"; git config user.email "noreply@github.com"
          git add social && git commit -m "Record Facebook catch-up posts" && git push origin HEAD:main || true
          git fetch origin probe-out && git checkout probe-out
          cp /tmp/probe.txt probe-fb.txt && git add probe-fb.txt && git commit -m "probe fb" && git push origin probe-out
