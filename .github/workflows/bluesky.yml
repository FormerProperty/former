name: Post to Bluesky and Facebook (formerly. and grandly.)
on:
  schedule:
    # formerly.: 8am, 12pm and 6pm UK time; grandly.: 8am and 6pm. All year:: runs in both the GMT and BST hours,
    # and the script only posts when it is the right hour in London
    # GitHub often starts scheduled runs late, so several runs are queued around each slot;
    # the script posts once per slot and the extra runs do nothing
    - cron: "37,52 6,7,10,11,16,17 * * *"
    - cron: "7,22,37 7,8,11,12,17,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bluesky
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post the next building
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ -z "$BLUESKY_HANDLE" ] || [ -z "$BLUESKY_APP_PASSWORD" ]; then
            echo "Bluesky secrets not set yet; showing what would be posted."
            python build/bluesky.py --dry-run --now
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python build/bluesky.py --now; else python build/bluesky.py; fi
      - name: Post the next Grandly house (8am and 6pm only)
        if: always()
        env:
          GRANDLY_BLUESKY_HANDLE: ${{ secrets.GRANDLY_BLUESKY_HANDLE }}
          GRANDLY_BLUESKY_APP_PASSWORD: ${{ secrets.GRANDLY_BLUESKY_APP_PASSWORD }}
          GRANDLY_FB_PAGE_ID: ${{ secrets.GRANDLY_FB_PAGE_ID }}
          GRANDLY_FB_PAGE_TOKEN: ${{ secrets.GRANDLY_FB_PAGE_TOKEN }}
        run: |
          if [ -z "$GRANDLY_BLUESKY_HANDLE" ] || [ -z "$GRANDLY_BLUESKY_APP_PASSWORD" ]; then
            echo "Grandly Bluesky secrets not set; showing what would be posted."
            python build/bluesky.py --site grandly --dry-run --now
            exit 0
          fi
          python build/bluesky.py --site grandly
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "formerly. bot"
          git config user.email "noreply@github.com"
          git add social
          git diff --cached --quiet || (git commit -m "Record social post" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done)
